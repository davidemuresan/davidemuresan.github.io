  <body>
    <!-- Boot overlay: purely decorative, auto-hides via CSS even if JS fails -->
    <div class="boot" id="boot" aria-hidden="true">
      <div class="boot__inner">
        <div class="boot__chip"><span></span></div>
        <p class="boot__line"><span class="boot__label" data-boot-label>Powering the board</span> <span class="boot__pct" id="boot-pct">00</span></p>
        <div class="boot__bar"><i id="boot-bar"></i></div>
      </div>
    </div>

    <a class="skip-link" href="#main" data-i18n-skip>Skip to content</a>

    <!-- WebGL canvas mounts here (decoration only) -->
    <div class="stage" id="stage" aria-hidden="true">
      <div class="stage__fallback"></div>
    </div>
    <div class="scrim" aria-hidden="true"></div>
    <div class="sweep" id="sweep" aria-hidden="true"></div>

    <header class="topbar" id="topbar"></header>

    <!-- Decorative HUD (hidden from assistive tech) -->
    <aside class="hud" aria-hidden="true">
      <div class="hud__progress"><i id="hud-bar"></i></div>
      <div class="hud__section"><span id="hud-index">00</span><span class="hud__sep">/</span><span>05</span></div>
      <div class="hud__coords" id="hud-coords">X 000.0 · Y 000.0 · Z 000.0</div>
    </aside>

    <main id="main" tabindex="-1"></main>
    <footer class="footer" id="footer"></footer>

    <noscript>
      <style>.boot{display:none}</style>
      <p style="padding:2rem;color:#e8f0ee">Davide-Andrei Mureșan · Networks & AI engineer · davide.muresan2003@yahoo.com · github.com/davideboss2003</p>
